<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#fbfaf7">
    <link rel="icon" href="icons/icon-512.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <title>Create account — GatherUp</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="noise"></div>
    <div class="auth-page">
        <div class="auth-shell">
            <section class="auth-brand-panel"><a class="brand" href="/"><span class="brand-logo"><img
                            src="icons/logo.png" alt="GatherUp"></span><span
                        class="brand-name">Gather<span>Up</span></span></a>
                <h1>Bring everyone<br><em>into the plan.</em></h1>
                <p>Create your GatherUp account and build your first shared space.</p>
                <div class="auth-orbit"></div>
            </section>
            <section class="auth-form-panel">
                <div class="form-wrap"><a class="back-home" href="/">← Back to GatherUp</a>
                    <div class="auth-logo-small"><img src="icons/logo.png" alt="GatherUp"></div>
                    <h2 style="margin-top:18px">Create your account.</h2>
                    <p class="form-sub">Use your real details — no example names, no pre-filled personal data.</p>
                    <form id="registerForm">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                            <div class="field"><label for="firstName">First name</label><input id="firstName"
                                    type="text" autocomplete="given-name" placeholder="First name" required></div>
                            <div class="field"><label for="lastName">Last name</label><input id="lastName" type="text"
                                    autocomplete="family-name" placeholder="Last name" required></div>
                        </div>
                        <div class="field"><label for="regEmail">Email address</label><input id="regEmail" type="email"
                                autocomplete="email" placeholder="you@example.com" required></div>
                        <div class="field"><label for="regPassword">Password</label>
                            <div class="field-control"><input id="regPassword" type="password"
                                    autocomplete="new-password" placeholder="Create a strong password" required
                                    minlength="8"><button class="password-toggle" type="button"
                                    data-password="regPassword">Show</button></div>
                            <div class="strength"><span id="strengthBar"></span></div>
                        </div>
                        <label class="check" style="margin:5px 0 19px"><input id="terms" type="checkbox" required> I
                            agree to the terms and privacy policy.</label>
                        <button class="btn btn-primary form-submit" type="submit">Create account <span>↗</span></button>
                    </form>
                    <p class="form-bottom">Already have an account? <a href="/login">Log in</a></p>
                </div>
            </section>
        </div>
    </div>
    <script src="js/app.js?v=4"></script>
</body>

</html>

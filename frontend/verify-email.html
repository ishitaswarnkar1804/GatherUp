<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#fbfaf7">
    <link rel="icon" href="/assets/icons/icon-512.png">
    <title>Email verification — GatherUp</title>
    <link rel="stylesheet" href="/assets/style.css">
    <style>
        .verify-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 12% 8%, rgba(255,216,77,.30), transparent 28%),
                radial-gradient(circle at 88% 12%, rgba(155,140,255,.18), transparent 24%),
                #fffaf2;
        }
        .verify-card {
            width: min(520px, 100%);
            background: rgba(255,255,255,.94);
            border: 1px solid rgba(41,35,31,.09);
            border-radius: 28px;
            padding: 38px;
            box-shadow: 0 25px 70px rgba(45,32,18,.12);
        }
        .verify-logo {
            width: 58px;
            height: 58px;
            object-fit: contain;
            margin-bottom: 18px;
        }
        .verify-icon {
            font-size: 44px;
            margin-bottom: 12px;
        }
        .verify-card h1 {
            margin: 0 0 10px;
            font-size: 30px;
            letter-spacing: -.8px;
        }
        .verify-card p {
            color: #766b64;
            line-height: 1.65;
            margin: 0 0 22px;
        }
        .verify-message {
            padding: 13px 15px;
            border-radius: 14px;
            background: #fff5c9;
            color: #5d4c00;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }
        .verify-message.show {
            display: block;
        }
        .verify-message.error {
            background: #ffe1e1;
            color: #8b2020;
        }
        .verify-form {
            display: grid;
            gap: 10px;
            margin-top: 18px;
        }
        .verify-form input {
            width: 100%;
            border: 1px solid rgba(41,35,31,.13);
            border-radius: 13px;
            padding: 13px 14px;
            outline: none;
        }
        .verify-form button {
            border: 0;
            border-radius: 13px;
            padding: 13px 16px;
            background: #f6c445;
            color: #29231f;
            font-weight: 800;
            cursor: pointer;
        }
        .verify-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .verify-links a {
            color: #29231f;
            font-weight: 750;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="verify-page">
        <section class="verify-card">
            <img class="verify-logo" src="/assets/icons/logo.png" alt="GatherUp">
            <div class="verify-icon" id="verifyIcon">✉️</div>
            <h1 id="verifyTitle">Check your inbox.</h1>
            <p id="verifyText">
                We sent a verification link to your email address. Open it to activate your GatherUp account.
            </p>
            <div class="verify-message" id="verifyMessage"></div>

            <form class="verify-form" id="resendForm">
                <input id="resendEmail" type="email" autocomplete="email" placeholder="Your email address" required>
                <button type="submit" id="resendButton">Send verification email again</button>
            </form>

            <div class="verify-links">
                <a href="/login">← Back to login</a>
                <a href="/">GatherUp home</a>
            </div>
        </section>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const status = params.get("status");
        const title = document.getElementById("verifyTitle");
        const text = document.getElementById("verifyText");
        const icon = document.getElementById("verifyIcon");
        const message = document.getElementById("verifyMessage");
        const form = document.getElementById("resendForm");
        const button = document.getElementById("resendButton");

        function showMessage(textValue, isError = false) {
            message.textContent = textValue;
            message.classList.toggle("error", isError);
            message.classList.add("show");
        }

        if (status === "success") {
            icon.textContent = "✅";
            title.textContent = "Email verified!";
            text.textContent = "Your GatherUp account is now verified. You can log in and start planning.";
            form.style.display = "none";
        } else if (status === "expired") {
            icon.textContent = "⏳";
            title.textContent = "That link expired.";
            text.textContent = "Verification links are valid for 30 minutes. Request a new one below.";
            showMessage("Your verification link has expired.", true);
        } else if (status === "invalid") {
            icon.textContent = "⚠️";
            title.textContent = "Verification link unavailable.";
            text.textContent = "The link is invalid or has already been used. Request a new verification email below.";
            showMessage("We could not verify that link.", true);
        }

        form.addEventListener("submit", async event => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Sending…";

            try {
                const response = await fetch("/auth/resend-verification", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: document.getElementById("resendEmail").value.trim()
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Unable to send verification email.");
                }

                showMessage(data.message || "Verification email sent.");
            } catch (error) {
                showMessage(error.message, true);
            } finally {
                button.disabled = false;
                button.textContent = "Send verification email again";
            }
        });
    </script>
</body>
</html>
